<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Děkujeme za zprávu. Brzy se vám ozveme.">
  <title>Děkujeme za zprávu | Šťastný rámař</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #30271f;
      background: #f6f3ef;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
    }

    main {
      width: min(100%, 38rem);
      padding: clamp(2rem, 7vw, 4.5rem);
      border: 1px solid #e5ddd4;
      border-radius: 1rem;
      background: #fff;
      text-align: center;
      box-shadow: 0 1rem 3rem rgb(48 39 31 / 8%);
    }

    .brand {
      margin: 0 0 2rem;
      color: #785a3b;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: .04em;
    }

    h1 {
      margin: 0 0 1rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3.25rem);
      font-weight: 500;
    }

    .message {
      margin: 0 auto 2rem;
      max-width: 30rem;
      color: #60574e;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: .85rem 1.35rem;
      border-radius: .35rem;
      background: #785a3b;
      color: #fff;
      font-weight: 650;
      text-decoration: none;
    }

    a:hover { background: #60462d; }
    a:focus-visible { outline: 3px solid #b68b5c; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Šťastný rámař</p>
    <h1>Děkujeme za zprávu</h1>
    <p class="message">Vaše zpráva byla úspěšně odeslána. Ozveme se vám co nejdříve.</p>
    <a href="index.html">Zpět na úvodní stránku</a>
  </main>
</body>
</html>
